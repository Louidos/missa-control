name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: uv installieren
        run: pip install uv
      - name: Abhängigkeiten installieren
        run: uv sync --frozen
      - name: Linter
        run: uv run ruff check .
      - name: Tests
        # Die Geräte-Tests starten den echten MQTT-Broker (Mosquitto) als eigenen Test-Container.
        # Hier dürfen sie nicht übersprungen werden.
        env:
          GERAETE_TESTS_PFLICHT: "1"
        run: uv run pytest

  frontend:
    name: Frontend (eslint, vitest, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Abhängigkeiten installieren
        run: npm ci
      - name: Linter
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

  docker:
    name: Docker (compose build, install.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Image bauen
        run: |
          cp .env.example .env
          docker compose -p missa-control build
          rm .env
      - name: Installation mit install.sh
        run: |
          ./scripts/install.sh
          curl -fsS http://127.0.0.1:8090/api/health
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8090/api/auth/abmelden -X POST)" = "401"
      - name: MQTT-Broker für Geräte läuft, lässt aber niemanden ohne Anmeldung herein
        run: |
          test -n "$(docker compose -p missa-control ps --status running -q mqtt)"
          # Das Panel meldet sich mit dem Passwort an, das der Broker beim ersten Start angelegt hat.
          for versuch in $(seq 1 30); do
            docker compose -p missa-control logs mqtt 2>&1 | grep -q "as missa-control-" && break
            sleep 1
          done
          docker compose -p missa-control logs mqtt 2>&1 | grep "as missa-control-"
          python3 - <<'PY'
          import socket
          verbindung = socket.create_connection(("127.0.0.1", 1883), timeout=5)
          verbindung.sendall(bytes([0x10, 12, 0, 4]) + b"MQTT" + bytes([4, 2, 0, 30, 0, 0]))  # CONNECT ohne Zugang
          antwort = verbindung.recv(4)
          assert antwort[:2] == b"\x20\x02" and antwort[3] != 0, antwort
          print("Ohne Anmeldung abgelehnt (Code %d)" % antwort[3])
          PY
          # Alle Daten liegen in ./data – es gibt keine Docker-Volumes.
          test -f data/mosquitto/dynamic-security.json
          test -z "$(docker volume ls -q --filter label=com.docker.compose.project=missa-control)"
      - name: Notfall-Reset der Zwei-Faktor-Anmeldung (reset-2fa.sh)
        run: |
          # Solange das Panel nicht eingerichtet ist, gibt es nichts zurückzusetzen.
          ./scripts/reset-2fa.sh --ja | tee /tmp/reset.txt
          grep -q "noch nicht eingerichtet" /tmp/reset.txt
          # Panel einrichten (Passwort und Code), zurücksetzen und prüfen: Einen neuen QR-Code gibt es
          # nur mit dem bisherigen Passwort.
          python3 - <<'PY'
          import base64, hashlib, hmac, http.cookiejar, json, struct, subprocess, time
          import urllib.error, urllib.request

          basis = "http://127.0.0.1:8090"
          oeffner = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(http.cookiejar.CookieJar()))

          def anfrage(pfad, daten=None):
              inhalt = json.dumps(daten).encode() if daten is not None else None
              kopf = {"Content-Type": "application/json", "Origin": basis}
              with oeffner.open(urllib.request.Request(basis + pfad, data=inhalt, headers=kopf)) as antwort:
                  return json.load(antwort)

          def code(geheimnis):
              pruefsumme = hmac.new(
                  base64.b32decode(geheimnis), struct.pack(">Q", int(time.time()) // 30), hashlib.sha1
              ).digest()
              stelle = pruefsumme[-1] & 15
              zahl = struct.unpack(">I", pruefsumme[stelle:stelle + 4])[0] & 0x7FFFFFFF
              return f"{zahl % 1_000_000:06d}"

          passwort = "ein-langes-test-passwort"
          geheimnis = anfrage("/api/auth/einrichten", {"passwort": passwort})["geheimnis"]
          anfrage("/api/auth/einrichten/bestaetigen", {"code": code(geheimnis)})
          assert anfrage("/api/auth/status")["angemeldet"] is True

          ausgabe = subprocess.run(
              ["./scripts/reset-2fa.sh", "--ja"], capture_output=True, text=True, check=True
          ).stdout
          assert "Die Zwei-Faktor-Anmeldung ist zurückgesetzt" in ausgabe, ausgabe
          status = anfrage("/api/auth/status")
          assert (status["eingerichtet"], status["zwei_faktor_neu"], status["angemeldet"]) == (False, True, False), status
          try:
              anfrage("/api/auth/einrichten", {"passwort": "ein-ganz-anderes-passwort"})
          except urllib.error.HTTPError as fehler:
              assert fehler.code == 401, fehler.code
          else:
              raise SystemExit("Ohne das bisherige Passwort darf es keinen neuen QR-Code geben")
          neues = anfrage("/api/auth/einrichten", {"passwort": passwort})["geheimnis"]
          assert neues != geheimnis
          print("Geprüft: Nach dem Reset gibt es einen neuen QR-Code nur mit dem bisherigen Passwort.")
          PY
      - name: Zweiter Lauf überschreibt weder .env noch Daten
        run: |
          sha256sum .env > /tmp/env.sum
          ./scripts/install.sh
          sha256sum -c /tmp/env.sum
          test -f data/missa-control.db
      - name: Backup enthält Datenbank und .env
        run: |
          ./scripts/backup.sh
          tar -tzf backups/missa-control-*.tar.gz | sort | tee /tmp/inhalt.txt
          grep -qx 'data/missa-control.db' /tmp/inhalt.txt
          grep -qx 'data/mosquitto/dynamic-security.json' /tmp/inhalt.txt
          grep -qx '.env' /tmp/inhalt.txt
      - name: Belegter Port bricht ab, ohne etwas Fremdes zu stoppen
        run: |
          docker compose -p missa-control down
          for port in 1883 8090; do
            python3 -m http.server "$port" >/dev/null 2>&1 &
            fremd=$!
            sleep 2
            if ./scripts/install.sh; then echo "install.sh hätte abbrechen müssen (Port $port)"; exit 1; fi
            curl -fsS -o /dev/null "http://127.0.0.1:$port/"
            test -z "$(docker compose -p missa-control ps -q)"
            kill "$fremd"
          done
      - name: Protokoll bei Fehler
        if: failure()
        run: docker compose -p missa-control logs --no-color || true
