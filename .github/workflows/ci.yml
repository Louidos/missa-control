name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: uv installieren
        run: pip install uv
      - name: Abhängigkeiten installieren
        run: uv sync --frozen
      - name: Linter
        run: uv run ruff check .
      - name: Tests
        run: uv run pytest

  frontend:
    name: Frontend (eslint, vitest, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Abhängigkeiten installieren
        run: npm ci
      - name: Linter
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

  docker:
    name: Docker (compose build, install.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Image bauen
        run: |
          cp .env.example .env
          docker compose -p missa-control build
          rm .env
      - name: Installation mit install.sh
        run: |
          ./scripts/install.sh
          curl -fsS http://127.0.0.1:8090/api/health
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8090/api/auth/abmelden -X POST)" = "401"
      - name: Zweiter Lauf überschreibt weder .env noch Daten
        run: |
          sha256sum .env > /tmp/env.sum
          ./scripts/install.sh
          sha256sum -c /tmp/env.sum
          test -f data/missa-control.db
      - name: Backup enthält Datenbank und .env
        run: |
          ./scripts/backup.sh
          tar -tzf backups/missa-control-*.tar.gz | sort | tee /tmp/inhalt.txt
          grep -qx 'data/missa-control.db' /tmp/inhalt.txt
          grep -qx '.env' /tmp/inhalt.txt
      - name: Belegter Port bricht ab, ohne etwas Fremdes zu stoppen
        run: |
          docker compose -p missa-control down
          python3 -m http.server 8090 >/dev/null 2>&1 &
          sleep 2
          if ./scripts/install.sh; then echo "install.sh hätte abbrechen müssen"; exit 1; fi
          curl -fsS -o /dev/null http://127.0.0.1:8090/
          test -z "$(docker compose -p missa-control ps -q)"
      - name: Protokoll bei Fehler
        if: failure()
        run: docker compose -p missa-control logs --no-color || true
