[project]
name = "missa-control"
version = "0.1.0"
description = "Lokales Admin- und Integrations-Panel für die KI-Assistentin Missa"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "cryptography>=44",
    "fastapi>=0.115",
    "httpx2>=2.10",
    "icalendar>=7.3.0",
    "mcp>=2.3,<3",
    "paho-mqtt>=2.1",
    "psutil>=6.0",
    "pyotp>=2.9",
    "python-multipart>=0.0.20",
    "pyyaml>=6.0",
    "segno>=1.6",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.34",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "radicale>=3.9.0",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/missa_control"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]
# Unverändert übernommene MicroPython-Bibliothek (nur für den Firmware-Prüfstand).
extend-exclude = ["tests/micropython"]

[tool.ruff.lint.isort]
known-first-party = ["missa_control", "hilfen"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501",   # Zeilenlänge regelt der Formatierer; lange Meldungstexte bleiben in einer Zeile
    "RUF001", # deutsche Texte enthalten typografische Zeichen
    "RUF002",
    "RUF003",
    "SIM300", # Konstanten dürfen links stehen
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.File", "fastapi.Form", "fastapi.Body"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # Der CalDAV-Testserver (Radicale) nutzt eine Schnittstelle, die Python künftig entfernt.
    "ignore::DeprecationWarning:radicale.*",
]
pythonpath = ["tests"]
addopts = "-q"
