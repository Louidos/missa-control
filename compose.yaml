# Missa Control – eigenes Compose-Projekt mit eigenen Containern und eigenem Netzwerk.
# Immer mit Projektnamen aufrufen:  docker compose -p missa-control ...
# Dieses Projekt fasst keine fremden Container, Volumes oder Netzwerke an und
# bindet den Docker-Socket nicht ein.
name: missa-control

services:
  missa-control:
    build: .
    image: missa-control:lokal
    restart: unless-stopped
    # Läuft nie als root. install.sh trägt die passende Benutzer-ID in .env ein.
    user: "${MISSA_CONTROL_UID:-10001}:${MISSA_CONTROL_GID:-10001}"
    environment:
      SECRET_KEY: ${SECRET_KEY:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      MISSA_CONTROL_COOKIE_SECURE: ${MISSA_CONTROL_COOKIE_SECURE:-auto}
      MISSA_CONTROL_ZEITZONE: ${MISSA_CONTROL_ZEITZONE:-Europe/Zurich}
      # Optional: Das Panel fragt missa-core nur lesend ab (HTTP-GET) – mehr nicht.
      MISSA_CORE_HEALTH_URL: ${MISSA_CORE_HEALTH_URL:-}
      # MQTT-Broker für Geräte: der Dienst „mqtt“ weiter unten (nur im eigenen Netz erreichbar).
      MISSA_CONTROL_MQTT_HOST: mqtt
      # Nur zur Anzeige: unter diesem Port erreichen die Geräte den Broker von aussen.
      MQTT_BIND: ${MQTT_BIND:-0.0.0.0:1883}
    # Damit MISSA_CORE_HEALTH_URL auch http://host.docker.internal:<Port>/… lauten kann, wenn missa-core
    # seinen Port auf ai01 veröffentlicht. Das betrifft nur die Namensauflösung in diesem Container.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${MISSA_CONTROL_BIND:-0.0.0.0:8090}:8090"
    volumes:
      - ./data:/data
      # Für die Serverlast: /proc und /sys von ai01, ausschliesslich lesend.
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    networks:
      - missa-control-net
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # MQTT-Broker für Geräte (ESP32, Raspberry Pi Pico) – gehört zum Profil "geraete".
  # Das Profil ist standardmässig aktiv (COMPOSE_PROFILES=geraete in .env). Wer keine Geräte
  # anbinden will, trägt dort COMPOSE_PROFILES= ein; dann startet dieser Dienst nicht.
  mqtt:
    image: eclipse-mosquitto:2
    profiles:
      - geraete
    restart: unless-stopped
    # Derselbe Benutzer wie das Panel (nie root): so gehören alle Dateien in data/ demselben Benutzer.
    user: "${MISSA_CONTROL_UID:-10001}:${MISSA_CONTROL_GID:-10001}"
    ports:
      - "${MQTT_BIND:-0.0.0.0:1883}:1883"
    volumes:
      - ./data/mosquitto:/mosquitto/data
      - ./config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    # Das Image sieht für /mosquitto/log ein Volume vor. Der Broker schreibt sein Protokoll aber auf
    # die Konsole (docker compose logs) – so entsteht kein namenloses Docker-Volume.
    tmpfs:
      - /mosquitto/log
    networks:
      - missa-control-net
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

networks:
  missa-control-net:
    name: missa-control-net
