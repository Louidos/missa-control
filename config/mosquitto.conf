# Mosquitto für die Geräte von Missa Control (ESP32, Raspberry Pi Pico).
#
# - Kein Zugriff ohne Anmeldung: Jedes Gerät hat eigenen Benutzer und eigenes Passwort und darf nur
#   seine eigenen Themen verwenden. Die Zugänge verwaltet das Panel (Seite „Geräte“).
# - Beim allerersten Start legt Mosquitto (ab Version 2.1) die Datei dynamic-security.json mit einem
#   Verwalter-Zugang an; dessen Passwort steht in dynamic-security.json.pw und wird nur vom Panel gelesen.
# - Alle Daten liegen in ./data/mosquitto im Repo-Ordner.

allow_anonymous false
listener 1883

plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/data/dynamic-security.json

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
